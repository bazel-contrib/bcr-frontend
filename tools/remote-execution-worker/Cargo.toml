[workspace]

[package]
name = "remote-execution-worker"
autobins = false
version = "0.1.0"
edition = "2024"

[lib]
name = "remote_execution_tunnel"
path = "src/tunnel.rs"

[[bin]]
name = "remote-execution-worker"
path = "src/main.rs"

[[bin]]
name = "remote-execution-gateway"
path = "src/gateway.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
