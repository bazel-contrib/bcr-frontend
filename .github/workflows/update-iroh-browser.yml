name: Update Iroh Browser Module

on:
  push:
    branches: [main]
    paths:
      - .bazelrc
      - .bazelversion
      - .github/workflows/update-iroh-browser.yml
      - MODULE.bazel
      - bazel_tools/deps/bcr.MODULE.bazel
      - bazel_tools/deps/rust.MODULE.bazel
      - bazel_tools/deps/tools.MODULE.bazel
      - multitool.lock.json
      - tools/invocation-iroh/BUILD.bazel
      - tools/invocation-iroh/build-browser.sh
      - tools/invocation-iroh/Cargo.toml
      - tools/invocation-iroh/Cargo.lock
      - tools/invocation-iroh/src/**
  workflow_dispatch:

concurrency:
  group: update-iroh-browser
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      # Use the same automation credential as the periodic submodule sync
      # to push the generated files to protected main.
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.BCR_AUTOMATION_TOKEN }}

      - name: Build the Iroh browser module
        env:
          BAZEL: bazelisk
        run: tools/invocation-iroh/build-browser.sh

      - name: Commit generated browser assets
        id: publish
        run: |
          git add -- app/bcr/iroh_wasm/bcr_invocation_iroh.js app/bcr/iroh_wasm/bcr_invocation_iroh_bg.wasm
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Iroh browser module"
          git push origin HEAD:refs/heads/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.result == 'success' && (needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-ghpages.yml
    secrets:
      BCR_AUTOMATION_TOKEN: ${{ secrets.BCR_AUTOMATION_TOKEN }}
